    <link rel="alternate" hreflang="x-default" href="https://sowhale.me/rexifstudio/en/">
    
    <!-- 自动跳转脚本 -->
    <script>
        const userLang = navigator.language || navigator.userLanguage;
        const browserLang = userLang.toLowerCase();
        let redirectLang = 'en';
        
        if (browserLang.startsWith('zh')) {
            if (browserLang === 'zh-tw' || browserLang === 'zh-hk') {
                redirectLang = 'zh-tw';
            } else {
                redirectLang = 'zh-cn';
            }
        } else if (browserLang.startsWith('ja')) {
            redirectLang = 'ja';
        }
        
        window.location.replace(`https://sowhale.me/rexifstudio/${redirectLang}/`);
    </script>
